play_announcement:
  name: Play Announcement
  description: Play a train announcement by command code.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
        config_entry:
          integration: lionel_controller
    announcement:
      name: Announcement Code
      description: The announcement command code to play.
      required: true
