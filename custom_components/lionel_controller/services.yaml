bell:
  name: Bell
  description: Ring the train bell for 0.5 seconds.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
        config_entry:
          integration: lionel_controller

lights_on:
  name: Lights On
  description: Turn on the train lights.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
        config_entry:
          integration: lionel_controller

lights_off:
  name: Lights Off
  description: Turn off the train lights.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
