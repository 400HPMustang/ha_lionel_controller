set_speed:
  name: Set Speed
  description: Set the train speed (0-100%).
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
        config_entry:
          integration: lionel_controller
    speed:
      name: Speed
      description: Speed percentage (0-100).
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_direction:
  name: Set Direction
  description: Set the train direction.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
        config_entry:
          integration: lionel_controller
    direction:
      name: Direction
      description: Direction of travel.
      required: true
      example: "forward"
      selector:
        select:
          options:
            - "forward"
            - "reverse"

stop:
  name: Stop
  description: Stop the train immediately.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
        config_entry:
          integration: lionel_controller

horn:
  name: Horn
  description: Sound the train horn for 0.5 seconds.
  fields:
    config_entry_id:
      name: Train
      description: Lionel train to control. Required when more than one train is configured.
      selector:
